<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

    />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="manifest.json" />
    <title>VibhavWealth • Intelligent Finance</title>

    <meta
      name="description"
      content="An elite financial tracking and intelligence platform featuring real-time wealth dynamics, institutional reporting, and AI-powered capital analysis."
    />
    <meta
      name="keywords"
      content="finance, wealth management, ledger, AI insights, investment tracking"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VibhavWealth • Intelligent Finance" />
    <meta
      property="og:description"
      content="An elite financial tracking and intelligence platform featuring real-time wealth dynamics and AI-powered capital analysis."
    />
    <meta
      property="og:image"
      content="https://vibhav-wealth.vercel.app/og-image.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="VibhavWealth • Intelligent Finance"
    />
    <meta
      property="twitter:description"
      content="An elite financial tracking and intelligence platform featuring real-time wealth dynamics and AI-powered capital analysis."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary:          "#6c9ef8",
              "primary-deep":   "#3b74e0",
              secondary:        "#5ecb8a",
              accent:           "#f5c842",
              danger:           "#e8685e",
              base:             "#090b10",
              "surface-0":      "#0d0f16",
              "surface-1":      "#13161f",
              "surface-2":      "#1b1e29",
              "surface-3":      "#232737",
              "text-primary":   "#eceef4",
              "text-secondary": "#8c92a4",
              "text-muted":     "#4e5566",
            },
            fontFamily: {
              display: ["DM Sans", "Inter", "sans-serif"],
              sans:    ["Inter", "system-ui", "sans-serif"],
            },
            borderRadius: {
              card: "22px",
              pill: "50px",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* =========================================
         DESIGN TOKENS
      ========================================= */
      :root {
        --primary:       #6c9ef8;
        --primary-deep:  #3b74e0;
        --primary-glow:  rgba(59,116,224,0.18);
        --secondary:     #5ecb8a;
        --accent:        #f5c842;
        --danger:        #e8685e;
        --base:          #090b10;
        --surface-0:     #0d0f16;
        --surface-1:     #13161f;
        --surface-2:     #1b1e29;
        --surface-3:     #232737;
        --border:        rgba(255,255,255,0.07);
        --border-focus:  rgba(108,158,248,0.35);
        --text-1:        #eceef4;
        --text-2:        #8c92a4;
        --text-3:        #4e5566;
        --radius-sm:     10px;
        --radius-md:     16px;
        --radius-lg:     22px;
        --radius-xl:     28px;
      }

      /* =========================================
         RESET & BASE
      ========================================= */
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html { scroll-behavior: smooth; }

      body {
        background: var(--base);
        color: var(--text-1);
        margin: 0;
        overflow-x: hidden;
        scrollbar-gutter: stable;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        touch-action: manipulation;
      }

      /* =========================================
         SURFACE / CARD SYSTEM
      ========================================= */
      .glass {
        background: var(--surface-1) !important;
        border: 1px solid var(--border) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .surface-2 { background: var(--surface-2); border: 1px solid var(--border); }
      .surface-3 { background: var(--surface-3); border: 1px solid var(--border); }

      /* Card elevation system */
      .card-sm  { border-radius: var(--radius-md); background: var(--surface-1); border: 1px solid var(--border); }
      .card-md  { border-radius: var(--radius-lg); background: var(--surface-1); border: 1px solid var(--border); }
      .card-lg  { border-radius: var(--radius-xl); background: var(--surface-1); border: 1px solid var(--border); }

      /* =========================================
         TYPOGRAPHY
      ========================================= */
      .font-display { font-family: 'DM Sans', 'Inter', sans-serif; }

      .text-hero   { font-size: clamp(28px, 6vw, 42px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
      .text-title  { font-size: clamp(18px, 4vw, 24px); font-weight: 700; letter-spacing: -0.02em; }
      .text-label  { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
      .text-mono   { font-family: 'DM Sans', monospace; font-variant-numeric: tabular-nums; }

      /* =========================================
         BUTTONS
      ========================================= */
      button {
        position: relative;
        cursor: pointer;
        border: none;
        outline: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
      }
      button:hover  { transform: translateY(-1px); }
      button:active { transform: translateY(0) scale(0.97); }

      .btn-primary {
        background: var(--primary-deep);
        color: #fff;
        box-shadow: 0 2px 12px var(--primary-glow);
      }
      .btn-primary:hover { box-shadow: 0 4px 20px var(--primary-glow); }

      .btn-primary-glow {
        background: var(--primary-deep) !important;
        box-shadow: 0 2px 12px var(--primary-glow) !important;
      }
      .btn-primary-glow:hover { box-shadow: 0 4px 20px var(--primary-glow) !important; }

      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover { background: var(--surface-2); color: var(--text-1); }

      .btn-danger {
        background: rgba(232,104,94,0.12);
        color: var(--danger);
        border: 1px solid rgba(232,104,94,0.2);
      }
      .btn-danger:hover { background: rgba(232,104,94,0.2); }

      /* =========================================
         INPUTS
      ========================================= */
      input, select, textarea {
        font-family: inherit;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text-1);
        outline: none;
        transition: border-color 0.2s, background 0.2s;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--border-focus);
        background: var(--surface-2);
      }
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--text-1);
        -webkit-box-shadow: 0 0 0 1000px var(--surface-2) inset;
        transition: background-color 5000s ease-in-out 0s;
      }

      /* =========================================
         BADGES
      ========================================= */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .badge-income  { background: rgba(94,203,138,0.12); color: var(--secondary); }
      .badge-expense { background: rgba(232,104,94,0.12);  color: var(--danger);    }
      .badge-transfer{ background: rgba(108,158,248,0.12); color: var(--primary);   }
      .badge-cc      { background: rgba(245,200,66,0.12);  color: var(--accent);    }

      /* =========================================
         DIVIDER
      ========================================= */
      .divider { height: 1px; background: var(--border); }

      /* =========================================
         SHINE SWEEP EFFECT
      ========================================= */
      .shine-hover { overflow: hidden; }
      .shine-hover::after {
        content: '';
        position: absolute;
        top: -60%; left: -120%;
        width: 60%; height: 220%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
        transform: rotate(20deg);
        transition: left 0.6s ease;
      }
      .shine-hover:hover::after { left: 160%; }

      /* =========================================
         SCROLLBAR
      ========================================= */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

      /* =========================================
         SPLASH SCREEN
      ========================================= */
      #splash-screen {
        position: fixed; inset: 0;
        background: var(--base);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 10000;
        transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1);
      }
      .splash-logo-container { position: relative; margin-bottom: 28px; }
      .splash-logo {
        width: 68px; height: 68px;
        background: var(--primary-deep);
        border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        position: relative; z-index: 2;
        box-shadow: 0 8px 32px var(--primary-glow);
      }
      .splash-logo-glow {
        position: absolute; inset: -20px;
        background: radial-gradient(circle, rgba(59,116,224,0.15) 0%, transparent 70%);
        animation: breath 2.5s infinite ease-in-out;
      }
      @keyframes breath {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50%       { transform: scale(1.12); opacity: 0.7; }
      }
      .splash-text {
        font-family: 'DM Sans', sans-serif;
        font-size: 13px; font-weight: 700;
        letter-spacing: 0.35em; text-transform: uppercase;
        color: var(--text-3); margin-bottom: 20px;
        animation: fadeInUp 0.7s ease-out;
      }
      .loading-bar-container {
        width: 140px; height: 2px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px; overflow: hidden;
      }
      .loading-bar-fill {
        width: 0%; height: 100%;
        background: var(--primary-deep);
        border-radius: 10px;
        animation: load 2.8s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes load { 0%{width:0%} 60%{width:82%} 100%{width:100%} }
      @keyframes fadeInUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

      /* =========================================
         KEYFRAME ANIMATIONS
      ========================================= */
      @keyframes fadeUp    { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
      @keyframes slideDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
      @keyframes pageIn    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
      @keyframes scaleIn   { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
      @keyframes modalIn   { from{opacity:0;transform:scale(0.96) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
      @keyframes backdropIn{ from{opacity:0} to{opacity:1} }
      @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

      /* =========================================
         RESPONSIVE / MOBILE / LANDSCAPE
      ========================================= */
      /* Landscape compact mode (phone rotated) */
      @media (orientation: landscape) and (max-height: 520px) {
        .landscape-compact { padding-top: 0.375rem !important; padding-bottom: 0.375rem !important; }
        .landscape-hide    { display: none !important; }
        .landscape-scroll  { overflow-y: auto; max-height: 100dvh; }
      }
      /* Small phones */
      @media (max-width: 375px) {
        .glass   { border-radius: var(--radius-md) !important; }
        .card-lg { border-radius: var(--radius-lg) !important; }
      }
      /* Safe area insets for notched phones */
      .safe-top    { padding-top:    env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 12px); }

      /* =========================================
         TAILWIND OVERRIDES (token alignment)
      ========================================= */
      .rounded-card { border-radius: var(--radius-lg) !important; }
      .rounded-pill { border-radius: 50px !important; }
    </style>

  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo-container">
        <div class="splash-logo-glow"></div>
        <div class="splash-logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L21 20H3L12 2Z" fill="white" />
            <path d="M12 7L18.5 20H5.5L12 7Z" fill="rgba(0,0,0,0.15)" />
          </svg>
        </div>
      </div>
      <div class="splash-text">VibhavWealth</div>
      <div class="loading-bar-container">
        <div class="loading-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          const splash = document.getElementById("splash-screen");
          if (splash) {
            splash.style.opacity = "0";
            setTimeout(() => splash.remove(), 800);
          }
        }, 2500);
      });
    </script>
  </body>
</html>
